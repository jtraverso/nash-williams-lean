fidelity:
  divergences: >-
    Graphs are Mathlib simple graphs on finite vertex types. A triangle decomposition is a finset
    of 3-cliques such that every edge lies in exactly one of them; triangle-divisible means that
    3 divides the number of edges and every degree is even; the degree condition is 3 · |V| ≤
    4 · δ(G) in natural numbers. A fractional triangle decomposition is a nonnegative real
    weighting of vertex sets such that for every edge the weights of the 3-cliques containing it
    sum to 1. σ-extremal (Definition 12.2 of Delcourt–Postle) is: at least (1 − σ)n vertices have
    degree at most (3/4 + σ)n, and some cut has at least (1 − σ)n²/4 edges. The stability theorem
    carries an order threshold n₀ not present in the original. The main theorem quantifies over
    vertex types in `Type` (universe 0).

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5 of the packaging, distinct from the mechanical verification:
    the agent checked that the Challenge statements and the seven reproduced definitions are
    textually identical to those of the library, that no global instance or notation in their
    import context affects their elaboration, that the Challenge compiles, and that the library
    sources are byte-identical to the header-corrected freeze. The mathematical development and
    the accompanying articles are the author's; no independent human review of the formalization
    has been performed yet.

