version: "v0.4"

project:
  name: "The Nash–Williams triangle-decomposition theorem"
  description: >-
    A Lean 4 / Mathlib formalization of the Nash–Williams theorem for large graphs proved by
    Delcourt and Postle: there is N such that every finite simple graph on n ≥ N vertices that is
    triangle-divisible (3 divides the number of edges and every degree is even) and has minimum
    degree at least 3n/4 has a triangle decomposition; together with Delcourt–Postle's fractional
    threshold (every graph with 3n ≤ 4δ has a fractional triangle decomposition) and their
    fractional stability theorem (with an additional order threshold). The proof follows their
    extremal/non-extremal case division but does not assume their Theorem 13.16, whose proof is
    assigned to an unpublished manuscript: the extremal residuals are decomposed with typed
    absorption results developed in the same project, and the non-extremal case with a protected
    covering-round argument. The development has 1,070 modules.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

