status:
  scope: >-
    The Nash–Williams theorem is proved for all sufficiently large finite simple graphs (vertex
    types in universe 0) with 3n ≤ 4δ(G) that are triangle-divisible; the fractional threshold
    for every finite simple graph with 3n ≤ 4δ(G); fractional stability with an order threshold
    n₀ that the original statement does not impose. The thresholds N, n₀, ε are existential and
    not explicit. Delcourt–Postle's Theorem 13.16 is not assumed: the proof-dependency audit in
    `RequestProject/NW18/AuditPaperIIAssembly.lean` forbids it and the earlier final theorem that
    used it.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

